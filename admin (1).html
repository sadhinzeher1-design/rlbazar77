<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RL Bazar Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b0b0d;color:#fff;font-family:Inter,system-ui,sans-serif}</style></head><body class="min-h-screen p-4 sm:p-8">
<div class="max-w-6xl mx-auto">
<header class="flex items-center justify-between gap-3 mb-8"><div><h1 class="text-2xl font-bold">RL <span class="text-red-500">BAZAR</span> Admin</h1><p class="text-gray-400 text-sm">Order management dashboard</p></div><button id="logoutBtn" class="hidden px-4 py-2 rounded bg-gray-800 hover:bg-gray-700">Log out</button></header>
<div id="loginCard" class="max-w-md mx-auto bg-zinc-900 border border-zinc-800 rounded-2xl p-6"><h2 class="text-xl font-semibold mb-4">Admin Login</h2><form id="loginForm" class="space-y-3"><input id="email" type="email" required placeholder="Admin email" class="w-full p-3 rounded bg-black border border-zinc-700"><input id="password" type="password" required placeholder="Password" class="w-full p-3 rounded bg-black border border-zinc-700"><button class="w-full bg-red-600 hover:bg-red-700 p-3 rounded font-semibold">Sign in</button></form><p id="loginMessage" class="text-sm text-red-400 mt-3"></p></div>
<section id="dashboard" class="hidden"><div class="flex flex-wrap items-center justify-between gap-3 mb-5"><h2 class="text-xl font-bold">Orders</h2><button id="refreshBtn" class="px-4 py-2 rounded bg-zinc-800 hover:bg-zinc-700">Refresh</button></div><div id="orderList" class="space-y-4"></div><p id="dashMessage" class="text-sm text-gray-400 mt-4"></p></section>
</div>
<script>
const SUPABASE_URL='YOUR_SUPABASE_PROJECT_URL'; const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';
const sb=(SUPABASE_URL.startsWith('https://')&&SUPABASE_ANON_KEY!=='YOUR_SUPABASE_ANON_KEY')?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const loginCard=document.getElementById('loginCard'),dashboard=document.getElementById('dashboard'),logoutBtn=document.getElementById('logoutBtn');
function showMessage(id,msg){document.getElementById(id).textContent=msg;}
function showDashboard(){loginCard.classList.add('hidden');dashboard.classList.remove('hidden');logoutBtn.classList.remove('hidden');loadOrders();}
async function loadOrders(){const list=document.getElementById('orderList');list.innerHTML='<p class="text-gray-400">Loading orders…</p>';if(!sb){list.innerHTML='';showMessage('dashMessage','Set your Supabase URL and anon key in this file first.');return;}const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false});if(error){list.innerHTML='';showMessage('dashMessage',error.message);return;}showMessage('dashMessage',data.length+' order(s)');if(!data.length){list.innerHTML='<p class="text-gray-400">No orders yet.</p>';return;}list.innerHTML=data.map(o=>`<article class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 sm:p-5"><div class="flex flex-wrap justify-between gap-2"><h3 class="font-bold">${esc(o.customer_name)} <span class="text-gray-400 font-normal">· ${esc(o.customer_phone)}</span></h3><strong class="text-red-400">৳${Number(o.total).toLocaleString()}</strong></div><p class="text-gray-300 text-sm mt-2">${esc(o.customer_address)}</p><div class="mt-3 text-sm text-gray-300">${(o.items||[]).map(i=>`${esc(i.name)} (${esc(i.size)}) ×${i.qty} — ৳${Number(i.line_total).toLocaleString()}`).join('<br>')}</div><div class="flex flex-wrap items-center gap-3 mt-4"><span class="text-xs text-gray-500">${new Date(o.created_at).toLocaleString()}</span><select data-id="${o.id}" class="status bg-black border border-zinc-700 rounded p-2 text-sm"><option ${o.status==='New'?'selected':''}>New</option><option ${o.status==='Confirmed'?'selected':''}>Confirmed</option><option ${o.status==='Shipped'?'selected':''}>Shipped</option><option ${o.status==='Delivered'?'selected':''}>Delivered</option><option ${o.status==='Cancelled'?'selected':''}>Cancelled</option></select><button data-id="${o.id}" class="saveStatus bg-red-600 hover:bg-red-700 px-3 py-2 rounded text-sm">Save status</button></div></article>`).join('');list.querySelectorAll('.saveStatus').forEach(btn=>btn.onclick=async()=>{const sel=list.querySelector(`select[data-id="${btn.dataset.id}"]`);const {error}=await sb.from('orders').update({status:sel.value}).eq('id',btn.dataset.id);showMessage('dashMessage',error?error.message:'Order status updated');});}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();if(!sb){showMessage('loginMessage','Please configure Supabase URL and anon key.');return;}const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){showMessage('loginMessage',error.message);return;}showMessage('loginMessage','');showDashboard();};logoutBtn.onclick=async()=>{if(sb)await sb.auth.signOut();dashboard.classList.add('hidden');loginCard.classList.remove('hidden');logoutBtn.classList.add('hidden');};document.getElementById('refreshBtn').onclick=loadOrders;
if(sb)sb.auth.getSession().then(({data})=>{if(data.session)showDashboard();});
</script></body></html>
